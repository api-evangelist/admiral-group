name: Admiral Group
kind: company
description: >-
  Admiral Group plc is a FTSE 100 personal-lines insurance group headquartered in
  Cardiff, Wales, and listed on the London Stock Exchange since 2004. Its home
  market is the United Kingdom, where it is one of the largest motor insurers,
  trading through the Admiral, Bell, Diamond, elephant.co.uk and Veygo brands and
  underwriting through EUI Limited and Admiral Insurance Company Limited. Beyond
  UK motor it writes household, travel and pet insurance (expanded by the 2024
  acquisition of RSA's UK home and pet book, including the MORE THAN brand),
  runs the Admiral Money consumer lending arm, owns the Confused.com price
  comparison site, and operates internationally as ConTe.it in Italy, L'olivier
  in France and Admiral Seguros in Spain. Its Admiral Pioneer venture arm builds
  new businesses including Veygo, Admiral Business and the API-first embedded
  insurance venture Connect by Admiral, and in 2026 it agreed to acquire the
  commercial fleet insurtech Flock. Admiral's API posture is honestly recorded
  here as closed: it is a direct-to-consumer and price-comparison distributor,
  not a broker-channel or platform carrier. No developer, developers, docs or api
  subdomain resolves on admiralgroup.co.uk; the corporate site is bot-blocked to
  automated probes; admiral.com publishes 837 sitemap URLs with no developer,
  API, partner or integration page; and the only API hosts that resolve
  (api.admiral.com, api.veygo.com) are undocumented private mobile and web
  backends that return 502 and 403 respectively. No public self-serve API, no
  OpenAPI, no Postman collection, no GraphQL surface, no webhook or event
  catalog, and no ACORD, AL3 or NGDS reference was found. Distribution
  integration runs through price-comparison-website connections and partner
  agreements, not through a published developer program.
