actions:
  apisYmlUpdated: true
  openapiDirectoryCreated: false
  reason: >-
    Nothing real was found to harvest. apis[] is left empty and no openapi/
    directory was created, because recording the absence accurately is the
    correct outcome for a direct-to-consumer UK personal-lines carrier with no
    broker channel, no open-insurance mandate, and no published developer
    program.
