      Insurance, linked to admiral.com). Every developer field - docs, API
      reference, webhooks, authentication, sandbox, OpenAPI/Swagger, base
      endpoint, GraphQL - is empty. Independent corroboration of no public API.
  acordPosture: no ACORD reference found
  acordNote: >-
    No ACORD, AL3, ACORD XML, NGDS, or ACORD-certified reference appears on any
    Admiral Group property or in trade coverage of the group. This is
    consistent with its business model rather than a gap: ACORD AL3 and agency-
    download plumbing serve the broker/agency distribution channel, and Admiral
    is a direct and price-comparison personal-lines writer. Its actual data
    integrations are UK market utilities and comparison-site connections rather
    than ACORD messaging. The one "Admiral" that does surface alongside ACORD
    forms in search is Admiral Insurance Group (admiralins.com), the US excess
    and surplus carrier owned by W. R. Berkley - a different company and a
    homonym trap that must not be attributed here.
  insuranceVerbs:
    quote:
      exposed: false
      note: >-
        Quote is executed on Admiral's own consumer funnels and through
        price-comparison-website connections under private commercial
        agreements. No public quote API.
    bind:
      exposed: false
    issue:
      exposed: false
    fnol:
      exposed: false
      note: >-
        Claims are reported by phone and through the authenticated My Account
        web/app surface. No public FNOL API and no partner FNOL documentation.
    audience: none-public
  authModel:
    scheme: none-public
    note: >-
      No public authentication scheme is documented because no public API
      exists. Customer-facing authentication is a session login at
      admiral.com/myaccount (Thales/Gemalto identity solution referenced in
      vendor case-study material). Neither /.well-known/openid-configuration
      nor /.well-known/oauth-authorization-server is served on admiral.com or
      veygo.com (both 404). The private api.veygo.com gateway rejects
      anonymous calls with 403 Forbidden and publishes no auth documentation.
  webhooks:
    documented: false
    asyncapi: false
    note: No event catalog, webhook documentation, or AsyncAPI artifact exists. Absence is the finding.
  postman:
    public: false
    note: No public Postman workspace or collection found for Admiral Group or any of its brands.
  graphql:
    public: false
    note: No /graphql surface found on admiral.com, veygo.com, or admiralgroup.co.uk.
  grpc:
    public: false
    note: No published .proto files.
  sdks:
    public: false
    note: No public SDKs; no public GitHub repositories under any Admiral-owned organization.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: >-
      Private REST backends exist (api.admiral.com, api.veygo.com) but are
      undocumented and reject anonymous access. Nothing published.
  - protocol: GraphQL
    documented: false
  - protocol: WebSocket
    scheme: wss
    documented: false
  - protocol: SOAP
    documented: false
    note: No ACORD XML / SOAP partner endpoint is published.
  - protocol: EDI
    documented: false
    note: No AL3 / IVANS-style agency download surface, consistent with a direct-to-consumer carrier.
  subsidiaryNote: >-
    Admiral Group agreed in February 2026 to acquire Flock, the UK commercial
    fleet insurtech, for GBP 80m. Flock operates its own self-service Flock
    Portal and broker channel; flockcover.com and api.flockcover.com both
    return 403 to automated probes and no developer or docs subdomain resolves.
    Any Flock developer surface belongs to a separate provider record and is
    deliberately not claimed as an Admiral Group public API here.
